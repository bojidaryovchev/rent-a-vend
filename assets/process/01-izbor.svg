<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Избор</title>
  <desc id="desc">Three vending machine options with the middle machine selected by safety-yellow corner brackets.</desc>
  <!-- Service Bay icon system: square geometry, warm-paper linework, one safety-yellow signal -->
